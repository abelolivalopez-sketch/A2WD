name: App Android

on:
  workflow_dispatch:
  push:
    paths:
      - 'app-android/**'
      - '.github/workflows/app-android.yml'

permissions:
  contents: write

concurrency:
  group: app-android
  cancel-in-progress: true

jobs:
  compilar:
    runs-on: ubuntu-latest
    env:
      A2WD_VERSION_CODE: ${{ github.run_number }}
      A2WD_VERSION_NAME: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Comprobar los secretos de la firma
        env:
          ALMACEN: ${{ secrets.A2WD_KEYSTORE_BASE64 }}
          CLAVE: ${{ secrets.A2WD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$ALMACEN" ] || [ -z "$CLAVE" ]; then
            echo "::error::Faltan los secretos A2WD_KEYSTORE_BASE64 y A2WD_KEYSTORE_PASSWORD (pasos en docs/APP-ANDROID.md)"
            exit 1
          fi

      - name: Recuperar la clave de firma
        env:
          ALMACEN: ${{ secrets.A2WD_KEYSTORE_BASE64 }}
        run: echo "$ALMACEN" | base64 -d > "$RUNNER_TEMP/a2wd.keystore"

      - name: Compilar la app (APK y AAB)
        working-directory: app-android
        env:
          A2WD_KEYSTORE: ${{ runner.temp }}/a2wd.keystore
          A2WD_KEYSTORE_PASSWORD: ${{ secrets.A2WD_KEYSTORE_PASSWORD }}
          A2WD_KEY_ALIAS: a2wd
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Comprobar la firma
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app-android/app/build/outputs/apk/release/app-release.apk | tee firma.txt
          grep -qi "a7e5c12c736fd719e0ade504d07730708b85adc719ff2388153f4d1fbc9f9ad7" firma.txt

      - name: Preparar los archivos
        run: |
          mkdir -p salida
          cp app-android/app/build/outputs/apk/release/app-release.apk salida/A2WD.apk
          cp app-android/app/build/outputs/bundle/release/app-release.aab salida/A2WD.aab

      - uses: actions/upload-artifact@v4
        with:
          name: A2WD-android-${{ env.A2WD_VERSION_NAME }}
          path: salida/

      - name: Publicar el APK para descargar
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ env.A2WD_VERSION_NAME }}
          name: App A2WD para Android ${{ env.A2WD_VERSION_NAME }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            App de A2WD para Android (portal de clientes).
            Descarga: https://github.com/${{ github.repository }}/releases/latest/download/A2WD.apk
          files: salida/A2WD.apk
