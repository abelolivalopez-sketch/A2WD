<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Utah · prueba del perrito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Fraunces:opsz,wght@9..144,300..700&display=swap" rel="stylesheet">
<style>
  :root { --serif: "Fraunces", Georgia, serif; --sans: "Figtree", system-ui, sans-serif; }
  body { margin: 0; font: 400 1.05rem/1.7 var(--sans); color: #10294A; background: linear-gradient(180deg, #fff, #E4EFF9); }
  .sec { padding-block: clamp(3.5rem, 8vw, 6rem); }
</style>
</head>
<body>

<style>

.dog-sec .dog-grid { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 6vw, 4.5rem); align-items: center; width: min(1120px, 100% - 2.5rem); margin-inline: auto; }
.dog-sec .dog-title { font-family: var(--serif, Georgia, serif); font-weight: 400; font-size: clamp(2rem, 4.6vw, 3.2rem); line-height: 1.08; letter-spacing: -0.015em; margin: 0 0 1rem; color: var(--navy, #0E2A4D); }
.dog-sec .dog-lead { color: var(--muted, #4A6079); max-width: 46ch; margin: 0 0 1.6rem; }

.dog-sec .dog-foods { display: flex; flex-wrap: wrap; gap: .7rem; margin-bottom: 1.6rem; }
.dog-sec .food-btn { display: inline-flex; align-items: center; gap: .6rem; padding: .7rem 1.2rem .7rem .9rem; border: 2px solid var(--azure, #1E63B0); background: #fff; color: var(--navy, #0E2A4D); border-radius: 999px; font: 600 1rem/1 var(--sans, system-ui, sans-serif); cursor: pointer; transition: background-color .2s, transform .15s; }
.dog-sec .food-btn:hover { background: #DCEBF8; }
.dog-sec .food-btn:active { transform: scale(.95); }
.dog-sec .food-btn:focus-visible, .dog-sec .dog-hit:focus-visible { outline: 3px solid var(--azure, #1E63B0); outline-offset: 3px; }
.dog-sec .food-emoji { font-size: 1.5rem; line-height: 1; }

.dog-sec .dog-meter { max-width: 340px; }
.dog-sec .dog-meter-top { display: flex; justify-content: space-between; gap: 1rem; font-weight: 600; font-size: .92rem; margin-bottom: .4rem; color: var(--navy, #0E2A4D); }
.dog-sec .dog-meter-bar { height: 14px; border-radius: 999px; background: #DCEBF8; overflow: hidden; border: 1px solid #C5D9EC; }
.dog-sec .dog-meter-fill { height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg, #7FB2E5, #1E63B0); transition: width .6s cubic-bezier(.2, .7, .2, 1); }
.dog-sec .dog-count { margin: 1rem 0 0; font-weight: 600; color: var(--navy, #0E2A4D); }
.dog-sec .dog-hint { margin: .2rem 0 0; font-size: .92rem; color: var(--muted, #4A6079); }

.dog-sec .dog-right { display: grid; gap: 1.2rem; justify-items: center; }
.dog-sec .dog-say { position: relative; margin: 0; padding: .8rem 1.1rem; width: min(100%, 340px); min-height: 3.4em; display: grid; place-items: center; text-align: center; background: #fff; border: 2px solid var(--azure, #1E63B0); border-radius: 16px; font-weight: 500; color: var(--navy, #0E2A4D); }
.dog-sec .dog-say::after { content: ""; position: absolute; left: 50%; bottom: -11px; width: 18px; height: 18px; background: #fff; border-right: 2px solid var(--azure, #1E63B0); border-bottom: 2px solid var(--azure, #1E63B0); transform: translateX(-50%) rotate(45deg); }
.dog-sec .dog-say.pop { animation: dogpop .35s ease-out; }
@keyframes dogpop { from { transform: scale(.94); } to { transform: scale(1); } }

.dog-sec .dog-stage { position: relative; width: min(100%, 340px); aspect-ratio: 240 / 260; margin-top: .4rem; }
.dog-sec .dog-arch { position: absolute; inset: 5% 5% 0; border-radius: 999px 999px 18px 18px; background: linear-gradient(180deg, #DCEBF8, #fff 85%); border: 2px solid #C5D9EC; }
.dog-sec .dog { position: absolute; inset: 0; }
.dog-sec .dog-hit { display: block; width: 100%; height: 100%; padding: 0; border: 0; background: none; cursor: pointer; border-radius: 16px; -webkit-tap-highlight-color: transparent; }
.dog-sec .dog-hit svg { width: 100%; height: 100%; display: block; overflow: visible; }
.dog-sec .dog-mouth-target { position: absolute; left: 50%; top: 51%; width: 1px; height: 1px; pointer-events: none; }
.dog-sec .dog-fly { position: absolute; left: 0; top: 0; font-size: 2rem; line-height: 1; pointer-events: none; z-index: 6; will-change: transform; }
.dog-sec .dog-heart { position: absolute; color: var(--azure, #1E63B0); font-size: 1.6rem; line-height: 1; pointer-events: none; z-index: 5; animation: dogrise 1.4s ease-out forwards; }
@keyframes dogrise { from { opacity: 0; transform: translateY(0) scale(.6); } 20% { opacity: 1; } to { opacity: 0; transform: translateY(-90px) scale(1.1); } }


.dog-sec .dog .tongue, .dog-sec .dog .mouth-open, .dog-sec .dog .eyes-closed, .dog-sec .dog .brows,
.dog-sec .dog .drool, .dog-sec .dog .zzz, .dog-sec .dog .blush { visibility: hidden; }

.dog-sec .dog-tail { transform-box: fill-box; transform-origin: 0% 100%; transition: transform .4s; }
.dog-sec .dog-head { transform-box: fill-box; transform-origin: 50% 100%; transition: transform .4s; }
.dog-sec .ear-l { transform-box: fill-box; transform-origin: 100% 0%; transition: transform .4s; }
.dog-sec .ear-r { transform-box: fill-box; transform-origin: 0% 0%; transition: transform .4s; }
.dog-sec .eyes-open { transform-box: fill-box; transform-origin: 50% 50%; animation: dogblink 4.6s infinite; }
@keyframes dogblink { 0%, 94%, 100% { transform: scaleY(1); } 96% { transform: scaleY(.1); } }


.dog-sec .dog.is-hungry .brows, .dog-sec .dog.is-hungry .drool { visibility: visible; }
.dog-sec .dog.is-hungry .ear-l { transform: rotate(10deg); }
.dog-sec .dog.is-hungry .ear-r { transform: rotate(-10deg); }
.dog-sec .dog.is-hungry .dog-tail { transform: rotate(18deg); }
.dog-sec .dog.is-hungry .dog-head { transform: rotate(-3deg); }
.dog-sec .dog.is-hungry .drool { animation: dogdrip 1.8s ease-in infinite; }
@keyframes dogdrip { 0% { transform: translateY(-3px); opacity: 0; } 30% { opacity: 1; } 100% { transform: translateY(9px); opacity: 0; } }

/* comiendo */
.dog-sec .dog.is-eating .mouth-open { visibility: visible; animation: dogchew .3s linear 4; }
.dog-sec .dog.is-eating .blush { visibility: visible; }
.dog-sec .dog.is-eating .dog-head { animation: dogbob .3s ease-in-out 4; }
.dog-sec .dog.is-eating .dog-tail, .dog-sec .dog.is-happy .dog-tail { animation: dogwag .35s ease-in-out infinite alternate; }
@keyframes dogchew { 0%, 49% { visibility: visible; } 50%, 100% { visibility: hidden; } }
@keyframes dogbob { 50% { transform: translateY(5px) rotate(2deg); } }
@keyframes dogwag { from { transform: rotate(-16deg); } to { transform: rotate(14deg); } }


.dog-sec .dog.is-happy .tongue, .dog-sec .dog.is-happy .blush { visibility: visible; }
.dog-sec .dog.is-happy .dog-head { animation: dogtilt 1s ease-in-out infinite alternate; }
@keyframes dogtilt { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }


.dog-sec .dog.is-full .eyes-closed, .dog-sec .dog.is-full .zzz { visibility: visible; }
.dog-sec .dog.is-full .eyes-open { visibility: hidden; }
.dog-sec .dog.is-full .dog-head { animation: dogsnooze 2.8s ease-in-out infinite; }
.dog-sec .dog.is-full .zzz { animation: dogzzz 2.4s ease-in-out infinite; }
@keyframes dogsnooze { 50% { transform: translateY(3px); } }
@keyframes dogzzz { 0%, 100% { opacity: .35; transform: translateY(0); } 50% { opacity: 1; transform: translateY(-6px); } }

@media (max-width: 800px) { .dog-sec .dog-grid { grid-template-columns: 1fr; } }
@media (prefers-reduced-motion: reduce) {
  .dog-sec *, .dog-sec *::before, .dog-sec *::after { animation: none !important; transition: none !important; }
}
</style>


<section class="sec dog-sec" id="perrito" data-section="perrito">
  <div class="dog-grid">
    <div>
      <h2 class="dog-title" data-dog="title"></h2>
      <p class="dog-lead" data-dog="lead"></p>

      <div class="dog-foods" role="group" data-dog-aria="foodsLabel">
        <button type="button" class="food-btn" data-food="bone"><span class="food-emoji" aria-hidden="true"></span><span data-dog="foodBone"></span></button>
        <button type="button" class="food-btn" data-food="baguette"><span class="food-emoji" aria-hidden="true"></span><span data-dog="foodBaguette"></span></button>
        <button type="button" class="food-btn" data-food="apple"><span class="food-emoji" aria-hidden="true"></span><span data-dog="foodApple"></span></button>
      </div>

      <div class="dog-meter">
        <div class="dog-meter-top"><span data-dog="hunger"></span><span id="dogMood"></span></div>
        <div class="dog-meter-bar" id="dogBar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="dog-meter-fill" id="dogFill"></div>
        </div>
      </div>
      <p class="dog-count" id="dogCount"></p>
      <p class="dog-hint" data-dog="hint"></p>
    </div>

    <div class="dog-right">
      <p class="dog-say" id="dogSay" role="status" aria-live="polite"></p>
      <div class="dog-stage" id="dogStage">
        <div class="dog-arch" aria-hidden="true"></div>
        <div class="dog is-hungry" id="dog">
          <button type="button" class="dog-hit" id="dogHit">
            <svg viewBox="0 0 240 260" aria-hidden="true" focusable="false">
            
              <ellipse cx="120" cy="246" rx="86" ry="10" fill="#BBD6F0"/>
              <g><circle cx="46" cy="242" r="5" fill="#fff"/><circle cx="46" cy="242" r="2" fill="#1E63B0"/><circle cx="196" cy="244" r="5" fill="#fff"/><circle cx="196" cy="244" r="2" fill="#1E63B0"/><circle cx="212" cy="238" r="4" fill="#fff"/><circle cx="212" cy="238" r="1.6" fill="#1E63B0"/></g>
           
              <g class="dog-tail"><path d="M164 212C198 206 208 172 192 148" fill="none" stroke="#D9A86A" stroke-width="16" stroke-linecap="round"/></g>
            
              <path d="M62 244C52 182 82 146 120 146s68 36 58 98Z" fill="#FFF7EA" stroke="#0E2A4D" stroke-width="3" stroke-linejoin="round"/>
              <ellipse cx="120" cy="208" rx="28" ry="34" fill="#fff"/>
              <rect x="88" y="206" width="24" height="40" rx="12" fill="#FFF7EA" stroke="#0E2A4D" stroke-width="3"/>
              <rect x="128" y="206" width="24" height="40" rx="12" fill="#FFF7EA" stroke="#0E2A4D" stroke-width="3"/>
            
              <path d="M84 156Q120 180 156 156" fill="none" stroke="#1E63B0" stroke-width="10" stroke-linecap="round"/>
            
              <g class="dog-head">
                <ellipse cx="120" cy="102" rx="54" ry="50" fill="#FFF7EA" stroke="#0E2A4D" stroke-width="3"/>
                <path d="M132 58C158 62 172 88 162 108C146 106 130 92 132 58Z" fill="#D9A86A"/>
                <g class="ear-l"><path d="M72 66C42 66 34 118 56 134C74 124 82 96 80 72Z" fill="#D9A86A" stroke="#0E2A4D" stroke-width="3" stroke-linejoin="round"/></g>
                <g class="ear-r"><path d="M168 66C198 66 206 118 184 134C166 124 158 96 160 72Z" fill="#D9A86A" stroke="#0E2A4D" stroke-width="3" stroke-linejoin="round"/></g>
                <g class="eyes-open"><circle cx="100" cy="98" r="6.5" fill="#0E2A4D"/><circle cx="140" cy="98" r="6.5" fill="#0E2A4D"/><circle cx="102" cy="95.5" r="2.2" fill="#fff"/><circle cx="142" cy="95.5" r="2.2" fill="#fff"/></g>
                <g class="eyes-closed" fill="none" stroke="#0E2A4D" stroke-width="3" stroke-linecap="round"><path d="M93 99Q100 106 107 99"/><path d="M133 99Q140 106 147 99"/></g>
                <g class="brows" stroke="#0E2A4D" stroke-width="3" stroke-linecap="round"><path d="M91 90L108 83"/><path d="M132 83L149 90"/></g>
                <g class="blush" fill="#F4A7B0" opacity=".75"><circle cx="86" cy="118" r="7"/><circle cx="154" cy="118" r="7"/></g>
                <ellipse cx="120" cy="124" rx="26" ry="19" fill="#fff" stroke="#0E2A4D" stroke-width="3"/>
                <path class="tongue" d="M113 132Q120 154 127 132Z" fill="#E86A7A" stroke="#0E2A4D" stroke-width="2"/>
                <path d="M120 122V131M106 133Q113 139 120 131Q127 139 134 133" fill="none" stroke="#0E2A4D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                <g class="mouth-open"><path d="M104 130Q120 160 136 130Z" fill="#0E2A4D"/><path d="M111 143Q120 153 129 143Q120 138 111 143Z" fill="#E86A7A"/></g>
                <path d="M111 113Q120 106 129 113Q127 122 120 123Q113 122 111 113Z" fill="#0E2A4D"/>
                <path class="drool" d="M137 136q-5 8 0 11q5-3 0-11Z" fill="#9CC9F2"/>
              </g>
             
              <circle cx="120" cy="178" r="7" fill="#fff" stroke="#0E2A4D" stroke-width="2.5"/>
            
              <g class="zzz" fill="#1E63B0" font-family="Georgia, serif" font-weight="700"><text x="172" y="58" font-size="22">z</text><text x="188" y="38" font-size="16">z</text><text x="200" y="22" font-size="12">z</text></g>
            </svg>
          </button>
        </div>
        <span class="dog-mouth-target" id="dogMouth"></span>
      </div>
    </div>
  </div>
</section>

<script>
/* ---------- Perrito: lógica ---------- */
(() => {
  'use strict';
  const root = document.getElementById('perrito');
  if (!root) return;

  // ===== AJUSTES DEL PERRITO  =====
  const DOG_NAME = 'Croquette';
  const START_HUNGER = 22;                 // 0-100: cuanto más bajo, más hambre al entrar
  const FOODS = {                          // emoji y cuánto llena cada comida
    bone:     { emoji: '🦴', gain: 25 },
    baguette: { emoji: '🥖', gain: 35 },
    apple:    { emoji: '🍎', gain: 15 }
  };
  // ============================================

  const TEXT = {
    es: {
      title: '{name}, guardián del jardín',
      lead: 'Lleva toda la mañana vigilando la puerta y ya le suena la tripa. ¿Le das de comer?',
      foodsLabel: 'Elige qué darle de comer',
      foodBone: 'Hueso', foodBaguette: 'Baguette', foodApple: 'Manzana normanda',
      hunger: 'Barriguita', mHungry: 'Con hambre', mOk: 'Contento', mGood: 'Casi lleno', mFull: 'Lleno',
      count: 'Comidas dadas: {n}', hint: 'Toca al perrito para hacerle mimos.',
      idleHungry: 'Grrr… Eso ha sido mi tripa.', idleOk: 'Guau. Sigo vigilando la puerta.', idleFull: 'Zzz… Estoy muy lleno.',
      eat_bone: '¡Un hueso! Croc, croc, croc.', eat_baguette: '¡Baguette! Es un perro muy francés.', eat_apple: 'Manzana de Normandía. ¡Crunch!',
      full: 'Estoy lleno. Voy a echarme una siesta. Zzz…', tooFull: '¡Ya no puedo más! Vuelve dentro de un rato.',
      pet: '¡Guau! Me encantan los mimos.', petHungry: 'Gracias por los mimos… pero mejor con comida.',
      rumble: 'Grrr… mi tripa ha hablado otra vez.',
      m5: '¡5 comidas! Ya eres amigo de {name}.', m10: '¡10 comidas! {name} te nombra huésped de honor del jardín.',
      petLabel: 'Acariciar a {name}'
    },
    fr: {
      title: '{name}, gardien du jardin',
      lead: 'Il surveille la porte depuis ce matin et son ventre gargouille. Vous lui donnez à manger ?',
      foodsLabel: 'Choisissez quoi lui donner',
      foodBone: 'Os', foodBaguette: 'Baguette', foodApple: 'Pomme normande',
      hunger: 'Petit ventre', mHungry: 'Affamé', mOk: 'Content', mGood: 'Presque rassasié', mFull: 'Rassasié',
      count: 'Repas donnés : {n}', hint: 'Touchez le chien pour lui faire des câlins.',
      idleHungry: 'Grrr… C\'était mon ventre.', idleOk: 'Ouaf. Je surveille toujours la porte.', idleFull: 'Zzz… J\'ai trop mangé.',
      eat_bone: 'Un os ! Croc, croc, croc.', eat_baguette: 'Une baguette ! Un chien très français.', eat_apple: 'Pomme de Normandie. Croc !',
      full: 'Je suis rassasié. Petite sieste. Zzz…', tooFull: 'Je n\'en peux plus ! Revenez tout à l\'heure.',
      pet: 'Ouaf ! J\'adore les câlins.', petHungry: 'Merci pour les câlins… mais à manger, c\'est mieux.',
      rumble: 'Grrr… mon ventre a encore parlé.',
      m5: '5 repas ! Vous êtes maintenant ami avec {name}.', m10: '10 repas ! {name} vous nomme invité d\'honneur du jardin.',
      petLabel: 'Caresser {name}'
    },
    en: {
      title: '{name}, guardian of the garden',
      lead: 'He has been watching the gate all morning and his tummy is rumbling. Will you feed him?',
      foodsLabel: 'Choose what to feed him',
      foodBone: 'Bone', foodBaguette: 'Baguette', foodApple: 'Norman apple',
      hunger: 'Tummy', mHungry: 'Hungry', mOk: 'Happy', mGood: 'Almost full', mFull: 'Full',
      count: 'Meals given: {n}', hint: 'Tap the dog to give him a cuddle.',
      idleHungry: 'Grrr… That was my tummy.', idleOk: 'Woof. Still guarding the gate.', idleFull: 'Zzz… I\'m so full.',
      eat_bone: 'A bone! Crunch, crunch, crunch.', eat_baguette: 'A baguette! What a French dog.', eat_apple: 'Apple from Normandy. Crunch!',
      full: 'I\'m full. Time for a nap. Zzz…', tooFull: 'I can\'t eat another bite! Come back later.',
      pet: 'Woof! I love cuddles.', petHungry: 'Thanks for the cuddles… but food is better.',
      rumble: 'Grrr… my tummy spoke again.',
      m5: '5 meals! You\'re now friends with {name}.', m10: '10 meals! {name} names you guest of honour of the garden.',
      petLabel: 'Pet {name}'
    }
  };

  const $ = s => root.querySelector(s);
  const dog = $('#dog'), stage = $('#dogStage'), mouth = $('#dogMouth'), hit = $('#dogHit');
  const sayEl = $('#dogSay'), fill = $('#dogFill'), bar = $('#dogBar'), moodEl = $('#dogMood'), countEl = $('#dogCount');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const lang = () => (document.documentElement.lang || 'es').slice(0, 2);
  const T = (k, v = {}) => String((TEXT[lang()] || TEXT.es)[k] ?? TEXT.es[k] ?? k)
    .replace(/\{name\}/g, DOG_NAME).replace(/\{n\}/g, v.n ?? '');

  let hunger = START_HUNGER, flying = false, eating = false, happyUntil = 0, lastNudge = Date.now(), count = 0, sayTimer;
  try { count = parseInt(localStorage.getItem('dogFeeds'), 10) || 0; } catch (e) {}
  const saveCount = () => { try { localStorage.setItem('dogFeeds', String(count)); } catch (e) {} };

  const mood = () => eating ? 'eating' : hunger >= 100 ? 'full' : Date.now() < happyUntil ? 'happy' : hunger < 35 ? 'hungry' : 'idle';
  const defaultLine = () => hunger >= 100 ? T('idleFull') : hunger < 35 ? T('idleHungry') : T('idleOk');

  function render() {
    dog.className = 'dog is-' + mood();
    fill.style.width = hunger + '%';
    bar.setAttribute('aria-valuenow', Math.round(hunger));
    const label = hunger < 35 ? T('mHungry') : hunger < 70 ? T('mOk') : hunger < 100 ? T('mGood') : T('mFull');
    moodEl.textContent = label; bar.setAttribute('aria-valuetext', label);
    countEl.textContent = T('count', { n: count });
  }
  function say(text) {
    sayEl.textContent = text;
    sayEl.classList.remove('pop'); void sayEl.offsetWidth; sayEl.classList.add('pop');
    clearTimeout(sayTimer);
    sayTimer = setTimeout(() => { const d = defaultLine(); if (sayEl.textContent !== d) sayEl.textContent = d; }, 6000);
  }
  function applyStrings() {
    root.querySelectorAll('[data-dog]').forEach(el => { el.textContent = T(el.dataset.dog); });
    root.querySelectorAll('[data-dog-aria]').forEach(el => el.setAttribute('aria-label', T(el.dataset.dogAria)));
    hit.setAttribute('aria-label', T('petLabel'));
    bar.setAttribute('aria-label', T('hunger'));
  }

  function hearts(n) {
    for (let i = 0; i < n; i++) {
      const h = document.createElement('span');
      h.className = 'dog-heart'; h.textContent = '♥'; h.setAttribute('aria-hidden', 'true');
      h.style.left = (36 + Math.random() * 28) + '%'; h.style.top = (24 + Math.random() * 10) + '%';
      h.style.animationDelay = (i * 0.18) + 's';
      stage.append(h); setTimeout(() => h.remove(), 1700 + i * 180);
    }
  }

  function fly(btn, emoji) {
    return new Promise(resolve => {
      if (reduce) return resolve();
      const s = stage.getBoundingClientRect(), b = btn.getBoundingClientRect(), m = mouth.getBoundingClientRect();
      const el = document.createElement('span');
      el.className = 'dog-fly'; el.textContent = emoji; el.setAttribute('aria-hidden', 'true'); stage.append(el);
      const x0 = b.left + b.width / 2 - s.left, y0 = b.top + b.height / 2 - s.top;
      const x1 = m.left - s.left, y1 = m.top - s.top;
      const anim = el.animate([
        { transform: `translate(${x0}px, ${y0}px) translate(-50%, -50%) scale(1) rotate(0deg)` },
        { transform: `translate(${(x0 + x1) / 2}px, ${Math.min(y0, y1) - 70}px) translate(-50%, -50%) scale(1.25) rotate(140deg)`, offset: .5 },
        { transform: `translate(${x1}px, ${y1}px) translate(-50%, -50%) scale(.6) rotate(300deg)` }
      ], { duration: 650, easing: 'cubic-bezier(.4, .1, .5, 1)' });
      const done = () => { el.remove(); resolve(); };
      anim.onfinish = done; anim.oncancel = done;
    });
  }

  async function feed(kind, btn) {
    if (flying || eating) return;
    if (hunger >= 100) { say(T('tooFull')); return; }
    flying = true;
    await fly(btn, FOODS[kind].emoji);
    flying = false; eating = true;
    hunger = Math.min(100, hunger + FOODS[kind].gain);
    count++; saveCount();
    render(); say(T('eat_' + kind)); hearts(3);
    setTimeout(() => {
      eating = false; happyUntil = Date.now() + 2500;
      render();
      if (hunger >= 100) say(T('full'));
      else if (count === 5 || count === 10) say(T('m' + count));
      setTimeout(render, 2600);
    }, reduce ? 300 : 1300);
  }

  function pet() {
    if (flying || eating) return;
    hearts(2); happyUntil = Date.now() + 2000;
    say(hunger < 35 ? T('petHungry') : T('pet'));
    render(); setTimeout(render, 2100);
  }

  // ---- Arranque ----
  root.querySelectorAll('.food-btn').forEach(b => {
    b.querySelector('.food-emoji').textContent = FOODS[b.dataset.food].emoji;
    b.addEventListener('click', () => feed(b.dataset.food, b));
  });
  hit.addEventListener('click', pet);
  applyStrings(); render(); sayEl.textContent = defaultLine();

  // con el tiempo le vuelve el hambre (poco a poco)
  setInterval(() => {
    if (!root.isConnected || flying || eating) return;
    hunger = Math.max(0, hunger - 2);
    render();
    if (hunger < 35 && Date.now() - lastNudge > 15000) { lastNudge = Date.now(); say(T('rumble')); }
  }, 3500);

  // si la web cambia de idioma, el perrito también
  new MutationObserver(() => { applyStrings(); render(); sayEl.textContent = defaultLine(); })
    .observe(document.documentElement, { attributes: true, attributeFilter: ['lang'] });
})();
</script>
<!-- ═══════════════════  FIN DEL MÓDULO DEL PERRITO  ═══════════════════ -->

</html>
