<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <title>Disputatio</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preload" href="fuentes/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fuentes/archivo-latin-standard-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/disputatio.css">
</head>
<body class="pagina-hoja">
  <header class="hoja-cabecera">
    <a class="volver" href="index.html">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
      <span data-t="volverGlobo">Retour au globe</span>
    </a>
    <a class="hoja-cabecera__marca" href="index.html" aria-label="Disputatio">
      <img src="img/logo.png" alt="" width="34" height="34">
      <span aria-hidden="true">Disputatio</span>
    </a>
    <div class="idiomas" role="group" aria-label="Langue" data-t-aria="idioma">
      <button type="button" data-idioma="fr" lang="fr" aria-label="Français">FR</button>
      <button type="button" data-idioma="en" lang="en" aria-label="English">EN</button>
    </div>
  </header>

  <main class="hoja">
    <article class="articulo articulo--hoja" aria-labelledby="titulo-disputatio" hidden></article>

    <div class="hoja__vacia" hidden>
      <p data-t="noEncontrada">Ce disputatio n'existe pas ou n'est plus publié.</p>
      <a href="index.html" data-t="volverGlobo">Retour au globe</a>
    </div>

    <nav class="hoja__nav" aria-label="Autres disputatio" data-t-aria="otras" hidden>
      <a class="hoja__paso hoja__paso--anterior" href="index.html" hidden>
        <span class="hoja__paso-etiqueta" data-t="anterior">Précédent</span>
        <span class="hoja__paso-titulo"></span>
      </a>
      <a class="hoja__paso hoja__paso--siguiente" href="index.html" hidden>
        <span class="hoja__paso-etiqueta" data-t="siguiente">Suivant</span>
        <span class="hoja__paso-titulo"></span>
      </a>
    </nav>
  </main>

  <footer class="pie pie--hoja">
    <p class="pie__lema" data-t="cafePhilo">Café philo</p>
    <nav class="redes" aria-label="Réseaux sociaux" data-t-aria="redes">
      <a class="red" href="https://www.instagram.com/_disputatio/" target="_blank" rel="noopener">Instagram</a>
      <a class="red" href="#" target="_blank" rel="noopener">Facebook</a>
      <a class="red" href="#" target="_blank" rel="noopener">TikTok</a>
    </nav>
    <p class="pie__credito" data-t="credito">Site conçu par A2WD Studio</p>
  </footer>

  <script type="module" src="js/disputatio.js"></script>
</body>
</html>
