<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Disputatio, café philo : sélectionnez un point du globe pour découvrir ce qui s'y est passé.">
  <title>Disputatio</title>
  <link rel="icon" href="img/logo.png" type="image/png">
  <link rel="preload" href="fuentes/archivo-latin-standard-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fuentes/instrument-serif-latin-400-italic.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="img/tierra-2k.png" as="image" crossorigin>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="cargando">
  <header class="marca">
    <a class="marca__enlace" href="index.html">
      <img class="marca__logo" src="img/logo.png" alt="" width="56" height="56">
      <span class="marca__textos">
        <span class="marca__antetitulo" data-t="cafePhilo">Café philo</span>
        <span class="marca__nombre">Disputatio</span>
      </span>
    </a>
    <p class="marca__entrada" data-t="entrada">Chaque point marque un disputatio. Sélectionnez-en un pour découvrir ce qui s'y est passé.</p>
  </header>

  <main class="escenario" aria-label="Globe des disputatio" data-t-aria="escena">
    <canvas class="escenario__lienzo"></canvas>
    <div class="escenario__marcadores"></div>
    <ol class="lista-disputatios" hidden></ol>
  </main>

  <aside class="ciudad" aria-labelledby="ciudad-nombre" hidden>
    <div class="ciudad__cabecera">
      <h2 class="ciudad__nombre" id="ciudad-nombre" tabindex="-1"></h2>
      <button class="ciudad__cerrar" type="button" aria-label="Fermer" data-t-aria="cerrar">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <p class="ciudad__cantidad"></p>
    <ol class="ciudad__lista"></ol>
  </aside>

  <footer class="pie">
    <nav class="redes" aria-label="Réseaux sociaux" data-t-aria="redes">
      <a class="red red--instagram" href="https://www.instagram.com/_disputatio/" target="_blank" rel="noopener" aria-label="Instagram"><span class="red__icono"></span></a>
      <a class="red red--facebook" href="#" target="_blank" rel="noopener" aria-label="Facebook"><span class="red__icono"></span></a>
      <a class="red red--tiktok" href="#" target="_blank" rel="noopener" aria-label="TikTok"><span class="red__icono"></span></a>
    </nav>
    <div class="idiomas" role="group" aria-label="Langue" data-t-aria="idioma">
      <button type="button" data-idioma="fr" lang="fr" aria-label="Français">FR</button>
      <button type="button" data-idioma="en" lang="en" aria-label="English">EN</button>
    </div>
  </footer>

  <script src="vendor/three-r128.min.js"></script>
  <script type="module" src="js/sitio.js"></script>
</body>
</html>
