<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Acceso · A2WD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script>
  // Se lee antes de que Supabase procese el enlace del correo
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    window.__tipoEnlace = h.get('type');               // invite | recovery
    window.__errorEnlace = h.get('error_description');
  })();
</script>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0B0B0A">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A2WD">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="../instalar.js" defer></script>
</head>
<body>
<main class="centro">
  <div class="caja">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:40px"><a class="brand" href="../index.html" id="logo" style="margin:0">A²WD <small>/ portal</small></a><div id="idioma"></div></div>

    <!-- Iniciar sesión -->
    <section id="vLogin">
      <p class="eyebrow" data-t="area_privada"></p>
      <h1 data-t="accede"></h1>
      <p class="muted" style="margin:10px 0 28px" data-t="accede_sub"></p>
      <form id="fLogin">
        <div class="campo"><label for="email" data-t="correo"></label><input id="email" type="email" autocomplete="email" required></div>
        <div class="campo"><label for="pass" data-t="contrasena_label"></label><input id="pass" type="password" autocomplete="current-password" required></div>
        <button class="btn solid" style="width:100%" type="submit" data-t="entrar"></button>
        <p class="error" id="errLogin"></p>
      </form>
      <p style="margin-top:18px;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><a href="#" id="irRecuperar" class="muted" data-t="olvidaste"></a><a href="../index.html" class="muted" data-t="volver_web"></a></p>
      <div data-instalar-banner></div>
    </section>

    <!-- Recuperar contraseña -->
    <section id="vRecuperar" class="oculto">
      <p class="eyebrow" data-t="rec_eyebrow"></p>
      <h1 data-t="rec_titulo"></h1>
      <p class="muted" style="margin:10px 0 28px" data-t="rec_sub"></p>
      <form id="fRecuperar">
        <div class="campo"><label for="emailRec" data-t="correo"></label><input id="emailRec" type="email" autocomplete="email" required></div>
        <button class="btn solid" style="width:100%" type="submit" data-t="enviar_enlace"></button>
        <p class="error" id="errRec"></p>
      </form>
      <p style="margin-top:18px;font-size:13.5px"><a href="#" id="volver" class="muted" data-t="volver"></a></p>
    </section>

    <!-- Crear contraseña (invitación o recuperación) -->
    <section id="vPassword" class="oculto">
      <p class="eyebrow" id="pwEyebrow" data-t="bienvenido"></p>
      <h1 id="pwTitulo" data-t="crea_pw"></h1>
      <p class="muted" style="margin:10px 0 28px" data-t="pw_sub"></p>
      <form id="fPassword">
        <div class="campo"><label for="pw1" data-t="nueva_pw"></label><input id="pw1" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="campo"><label for="pw2" data-t="repite_pw"></label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn solid" style="width:100%" type="submit" data-t="guardar_entrar"></button>
        <p class="error" id="errPw"></p>
      </form>
    </section>
  </div>
</main>

<script type="module">
import { sb, configurado, avisoSinConfigurar, toast, LOGO, t, selectorIdioma } from './app.js';

document.querySelectorAll('[data-t]').forEach((el) => (el.textContent = t(el.dataset.t)));
selectorIdioma(document.getElementById('idioma'));

document.getElementById('logo').insertAdjacentHTML('afterbegin', LOGO);
if (!configurado) { avisoSinConfigurar(); throw new Error('Sin configurar'); }

const $ = (id) => document.getElementById(id);
const ver = (id) => ['vLogin', 'vRecuperar', 'vPassword'].forEach((v) => $(v).classList.toggle('oculto', v !== id));

async function entrarSegunRol(userId) {
  const { data: perfil } = await sb.from('perfiles').select('rol').eq('id', userId).single();
  location.replace(perfil?.rol === 'creador' ? 'creador.html' : 'cliente.html');
}

function cargando(form, on) { form.querySelector('button[type=submit]').disabled = on; }

// ¿Viene de un enlace del correo?
if (window.__errorEnlace) {
  $('errLogin').textContent = t('err_enlace');
} else if (window.__tipoEnlace === 'invite' || window.__tipoEnlace === 'recovery') {
  if (window.__tipoEnlace === 'recovery') { $('pwEyebrow').textContent = t('rec_eyebrow'); $('pwTitulo').textContent = t('nueva_pw_titulo'); }
  ver('vPassword');
} else {
  const { data: { session } } = await sb.auth.getSession();
  if (session && new URLSearchParams(location.search).get('e') !== 'perfil') entrarSegunRol(session.user.id);
}
if (new URLSearchParams(location.search).get('e') === 'perfil') {
  $('errLogin').textContent = t('err_perfil');
}

$('fLogin').addEventListener('submit', async (e) => {
  e.preventDefault(); cargando(e.target, true); $('errLogin').textContent = '';
  const { data, error } = await sb.auth.signInWithPassword({ email: $('email').value.trim(), password: $('pass').value });
  cargando(e.target, false);
  if (error) { $('errLogin').textContent = t('err_login'); return; }
  entrarSegunRol(data.user.id);
});

$('irRecuperar').onclick = (e) => { e.preventDefault(); $('emailRec').value = $('email').value; ver('vRecuperar'); };
$('volver').onclick = (e) => { e.preventDefault(); ver('vLogin'); };

$('fRecuperar').addEventListener('submit', async (e) => {
  e.preventDefault(); cargando(e.target, true);
  const redirectTo = location.origin + location.pathname;
  await sb.auth.resetPasswordForEmail($('emailRec').value.trim(), { redirectTo });
  cargando(e.target, false);
  // Mismo mensaje exista o no la cuenta, para no revelar correos
  toast(t('toast_rec'));
  ver('vLogin');
});

$('fPassword').addEventListener('submit', async (e) => {
  e.preventDefault(); $('errPw').textContent = '';
  if ($('pw1').value !== $('pw2').value) { $('errPw').textContent = t('no_coinciden'); return; }
  cargando(e.target, true);
  const { data, error } = await sb.auth.updateUser({ password: $('pw1').value });
  cargando(e.target, false);
  if (error) { $('errPw').textContent = t('err_guardar_pw', { e: error.message }); return; }
  history.replaceState(null, '', location.pathname);
  entrarSegunRol(data.user.id);
});
</script>
</body>
</html>
