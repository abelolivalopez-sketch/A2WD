<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net 'sha256-MR5rjWbxm3dXigt7qBGt2Ji/i7mjDA6kIjEEY2f4Sz8=' 'sha256-XbP1Qj01sfFO/rg1QgZ1bTcL++sHBMl1KgA3MP8CmhU='; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' https: data: blob:; connect-src 'self' https://vsqxcxmsvsektvsceqpx.supabase.co wss://vsqxcxmsvsektvsceqpx.supabase.co https://cdn.jsdelivr.net; frame-src https:; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Acceso · A2WD</title>
<link href="../fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script>
  // Se lee antes de que Supabase procese el enlace del correo
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    window.__tipoEnlace = h.get('type');               // invite | recovery
    window.__errorEnlace = h.get('error_description');
  })();
</script>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#0B0B0A">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../img/icono-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A2WD">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<script src="../instalar.js" defer></script>
</head>
<body>
<main class="centro">
  <div class="caja">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:40px"><a class="brand" href="../index.html" id="logo" style="margin:0">A²WD <small>/ portal</small></a><div id="idioma"></div></div>

    <!-- Iniciar sesión -->
    <section id="vLogin">
      <p class="eyebrow" data-t="area_privada"></p>
      <h1 data-t="accede"></h1>
      <p class="muted" style="margin:10px 0 28px" data-t="accede_sub"></p>
      <form id="fLogin">
        <div class="campo"><label for="email" data-t="correo"></label><input id="email" type="email" autocomplete="email" required></div>
        <div class="campo"><label for="pass" data-t="contrasena_label"></label><input id="pass" type="password" autocomplete="current-password" required></div>
        <button class="btn solid" style="width:100%" type="submit" data-t="entrar"></button>
        <p class="error" id="errLogin"></p>
      </form>
      <p style="margin-top:18px;font-size:13.5px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap"><a href="#" id="irRecuperar" class="muted" data-t="olvidaste"></a><a href="../index.html" class="muted" data-t="volver_web"></a></p>
      <div data-instalar-banner></div>
    </section>

    <!-- Recuperar contraseña -->
    <section id="vRecuperar" class="oculto">
      <p class="eyebrow" data-t="rec_eyebrow"></p>
      <h1 data-t="rec_titulo"></h1>
      <p class="muted" style="margin:10px 0 28px" data-t="rec_sub"></p>
      <form id="fRecuperar">
        <div class="campo"><label for="emailRec" data-t="correo"></label><input id="emailRec" type="email" autocomplete="email" required></div>
        <button class="btn solid" style="width:100%" type="submit" data-t="enviar_enlace"></button>
        <p class="error" id="errRec"></p>
      </form>
      <p style="margin-top:18px;font-size:13.5px"><a href="#" id="volver" class="muted" data-t="volver"></a></p>
    </section>

    <!-- Crear contraseña (invitación o recuperación) -->
    <section id="vPassword" class="oculto">
      <p class="eyebrow" id="pwEyebrow" data-t="bienvenido"></p>
      <h1 id="pwTitulo" data-t="crea_pw"></h1>
      <p class="muted" style="margin:10px 0 28px" data-t="pw_sub"></p>
      <form id="fPassword">
        <div class="campo"><label for="pw1" data-t="nueva_pw"></label><input id="pw1" type="password" autocomplete="new-password" minlength="8" required></div>
        <div class="campo"><label for="pw2" data-t="repite_pw"></label><input id="pw2" type="password" autocomplete="new-password" minlength="8" required></div>
        <button class="btn solid" style="width:100%" type="submit" data-t="guardar_entrar"></button>
        <p class="error" id="errPw"></p>
      </form>
    </section>
    <p class="muted" style="margin-top:32px;font-size:12.5px;text-align:center"><a href="../legal.html#privacidad" style="color:inherit">Privacidad · Confidentialité</a> · <a href="../legal.html#cookies" style="color:inherit">Cookies</a></p>
  </div>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
