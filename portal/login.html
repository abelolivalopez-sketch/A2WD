<link href="../fonts/fonts.css" rel="stylesheet">
<link rel="stylesheet" href="portal.css">
<script>
  // Se lee antes de que Supabase procese el enlace del correo
  (function () {
    var h = new URLSearchParams(location.hash.slice(1));
    window.__tipoEnlace = h.get('type');               // invite | recovery
    window.__errorEnlace = h.get('error_description');
  })();
</script>
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#05060c">
<link rel="icon" href="../img/favicon.svg" type="image/svg+xml">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="A2WD">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script src="../instalar.js" defer></script>
</head>
<body>
<main class="acceso">
  <div class="acceso-top">
    <a class="acceso-volver" href="../index.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg><span data-t="volver_web2"></span></a>
    <div id="idioma"></div>
  </div>

  <div class="acceso-centro">
    <a class="marca" href="../index.html" aria-label="A2WD">
      <svg class="marca-orbita" viewBox="0 0 360 118" aria-hidden="true"><ellipse class="o-anillo2" cx="180" cy="59" rx="178" ry="46"/><ellipse class="o-anillo" cx="180" cy="59" rx="160" ry="34"/><circle class="o-sat" r="2.6"/></svg>
      <span class="marca-txt">A2WD</span>
    </a>
    <p class="marca-sub" data-t="area_privada"></p>

    <div class="caja">
      <!-- Iniciar sesión -->
      <section id="vLogin">
        <h1 data-t="accede"></h1>
        <p class="sub" data-t="accede_sub"></p>
        <form id="fLogin">
          <div class="campo"><label for="email" data-t="correo"></label><div class="campo-i"><input id="email" type="email" autocomplete="email" required><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg></div></div>
          <div class="campo"><div class="fila-label"><label for="pass" data-t="contrasena_label"></label><a href="#" id="irRecuperar" data-t="olvidaste"></a></div><div class="campo-i"><input id="pass" class="con-ojo" type="password" autocomplete="current-password"  required><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg><button type="button" class="ver-pw" data-ver="pass"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <button class="btn solid" type="submit" data-t="entrar"></button>
          <p class="error" id="errLogin" role="alert"></p>
        </form>
      </section>

      <!-- Recuperar contraseña -->
      <section id="vRecuperar" class="oculto">
        <h1 data-t="rec_titulo"></h1>
        <p class="sub" data-t="rec_sub"></p>
        <form id="fRecuperar">
          <div class="campo"><label for="emailRec" data-t="correo"></label><div class="campo-i"><input id="emailRec" type="email" autocomplete="email" required><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m4 7 8 6 8-6"/></svg></div></div>
          <button class="btn solid" type="submit" data-t="enviar_enlace"></button>
          <p class="error" id="errRec" role="alert"></p>
        </form>
        <p class="caja-pie"><a href="#" id="volver" data-t="volver"></a></p>
      </section>

      <!-- Crear contraseña (invitación o recuperación) -->
      <section id="vPassword" class="oculto">
        <p class="eyebrow" id="pwEyebrow" data-t="bienvenido"></p>
        <h1 id="pwTitulo" data-t="crea_pw"></h1>
        <p class="sub" data-t="pw_sub"></p>
        <form id="fPassword">
          <div class="campo"><label for="pw1" data-t="nueva_pw"></label><div class="campo-i"><input id="pw1" class="con-ojo" type="password" autocomplete="new-password" minlength="8" required><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg><button type="button" class="ver-pw" data-ver="pw1"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <div class="campo"><label for="pw2" data-t="repite_pw"></label><div class="campo-i"><input id="pw2" class="con-ojo" type="password" autocomplete="new-password" minlength="8" required><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><path d="M12 14.5v2.5"/></svg><button type="button" class="ver-pw" data-ver="pw2"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
          <button class="btn solid" type="submit" data-t="guardar_entrar"></button>
          <p class="error" id="errPw" role="alert"></p>
        </form>
      </section>
    </div>

    <div class="acceso-instalar" data-instalar-banner></div>
  </div>

  <p class="acceso-legal"><a href="../legal.html#privacidad">Privacidad · Confidentialité</a> · <a href="../legal.html#cookies">Cookies</a></p>
</main>

<script type="module" src="js/login.js"></script>
</body>
</html>
